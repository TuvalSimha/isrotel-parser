name: Check EL AL Flight Price
on:
  schedule:
    - cron: '0 8 * * *'  # Once daily at 8:00 AM UTC (11:00 AM Israel time)
  workflow_dispatch:

jobs:
  check-price:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Restore price cache
        uses: actions/cache/restore@v4
        with:
          path: last_prices.json
          key: elal-price-${{ github.run_id }}
          restore-keys: |
            elal-price-

      - name: Check price
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANUAL_TRIGGER: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: node scripts/check-price.js
        continue-on-error: true

      - name: Upload debug screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: debug-screenshot.png
          retention-days: 1

      - name: Upload debug HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug-page.html
          retention-days: 1

      - name: Save price cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: last_prices.json
          key: elal-price-${{ github.run_id }}
